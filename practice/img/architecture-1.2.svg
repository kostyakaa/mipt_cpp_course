<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 770" width="1060" height="770"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="768" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ================= легенда ================= -->
  <g id="ownership" font-size="13">
    <text x="40" y="45" fill="#5c5e66">файлы:</text>

    <rect x="100" y="28" width="104" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="152" y="45" text-anchor="middle" fill="#80828c">комплект</text>

    <rect x="216" y="28" width="112" height="24" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="272" y="45" text-anchor="middle" fill="#dbdfe6">меняете</text>

    <rect x="340" y="28" width="132" height="24" fill="#dbdfe6"/>
    <text x="406" y="45" text-anchor="middle" fill="#0b0b0d" font-weight="bold">пишете с нуля</text>
  </g>
  <text x="492" y="45" font-size="13" fill="#5c5e66">комплект менять нельзя; остальное — ваш src/</text>

  <text x="40" y="78" font-size="13" fill="#5c5e66">связи:</text>
  <line x1="100" y1="73" x2="150" y2="73" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="160" y="78" font-size="13" fill="#80828c">хранит в поле</text>
  <line x1="290" y1="73" x2="340" y2="73" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="350" y="78" font-size="13" fill="#80828c">вызывает</text>

  <line x1="40" y1="96" x2="1020" y2="96" stroke="#26262b" stroke-width="1"/>

  <!-- ================= main ================= -->
  <rect x="40" y="112" width="300" height="150" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="190" y="142" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">main</text>
  <line x1="56" y1="156" x2="324" y2="156" stroke="#26262b" stroke-width="1"/>
  <text x="58" y="180" font-size="13" fill="#80828c">читает журнал, ведёт окно</text>
  <text x="58" y="199" font-size="13" fill="#80828c">--window-size N, по умолчанию 64</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="58" y="218" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="110" y="237" text-anchor="middle" fill="#dbdfe6">main.cpp</text>
  </g>
  <text x="178" y="237" font-size="12" fill="#80828c">печать [DETECT] и [CTX]</text>

  <!-- ================= разбор ================= -->
  <rect x="720" y="112" width="300" height="150" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="870" y="140" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">ParseEventLine</text>
  <text x="870" y="162" font-size="15" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">IsBlankOrComment</text>
  <text x="870" y="190" font-size="13" text-anchor="middle" fill="#80828c">строка журнала → Event</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="748" y="218" width="100" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="798" y="237" text-anchor="middle" fill="#80828c">parse.h</text>
    <rect x="860" y="218" width="112" height="28" fill="#dbdfe6"/>
    <text x="916" y="237" text-anchor="middle" fill="#0b0b0d" font-weight="bold">parse.cpp</text>
  </g>

  <!-- main → разбор -->
  <line x1="340" y1="172" x2="714" y2="172" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="527" y="162" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">IsBlankOrComment(&amp;line)</text>
  <text x="527" y="192" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">ParseEventLine(&amp;line, &amp;event)</text>

  <!-- ================= EventList ================= -->
  <rect x="40" y="320" width="620" height="220" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="350" y="350" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">EventList</text>
  <text x="350" y="372" font-size="13" text-anchor="middle" fill="#80828c">окно последних событий; владеет всеми узлами</text>

  <!-- цепочка узлов -->
  <g font-family="Consolas, Roboto Mono, monospace">
    <text x="140" y="396" font-size="12" text-anchor="middle" fill="#ff8a8a">head</text>
    <line x1="140" y1="400" x2="140" y2="418" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
    <text x="520" y="396" font-size="12" text-anchor="middle" fill="#ff8a8a">tail</text>
    <line x1="520" y1="400" x2="520" y2="418" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>

    <rect x="70" y="422" width="140" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
    <text x="140" y="450" font-size="13" text-anchor="middle" fill="#dbdfe6">EventNode</text>
    <rect x="260" y="422" width="140" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
    <text x="330" y="450" font-size="13" text-anchor="middle" fill="#dbdfe6">EventNode</text>
    <rect x="450" y="422" width="140" height="46" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="1.5"/>
    <text x="520" y="450" font-size="13" text-anchor="middle" fill="#dbdfe6">EventNode</text>

    <line x1="210" y1="445" x2="254" y2="445" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
    <text x="232" y="437" font-size="12" text-anchor="middle" fill="#ff8a8a">next</text>
    <line x1="400" y1="445" x2="444" y2="445" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
    <text x="422" y="437" font-size="12" text-anchor="middle" fill="#ff8a8a">next</text>
  </g>
  <text x="70" y="486" font-size="12" fill="#5c5e66">старое</text>
  <text x="590" y="486" font-size="12" text-anchor="end" fill="#5c5e66">новое</text>

  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="70" y="500" width="120" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="130" y="519" text-anchor="middle" fill="#80828c">event_list.h</text>
    <rect x="202" y="500" width="132" height="28" fill="#dbdfe6"/>
    <text x="268" y="519" text-anchor="middle" fill="#0b0b0d" font-weight="bold">event_list.cpp</text>
  </g>
  <text x="350" y="519" font-size="12" fill="#80828c">ещё два поля: size и capacity</text>

  <!-- main → окно -->
  <line x1="150" y1="262" x2="150" y2="314" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="140" y="293" font-size="12" text-anchor="end" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">window</text>
  <line x1="260" y1="262" x2="260" y2="314" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="270" y="293" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">ListPushBack(&amp;window, &amp;event)</text>

  <!-- ================= Event ================= -->
  <rect x="720" y="320" width="300" height="220" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="870" y="350" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Event</text>
  <line x1="736" y1="364" x2="1004" y2="364" stroke="#26262b" stroke-width="1"/>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13" fill="#dbdfe6">
    <text x="744" y="392">ts  type  pid</text>
    <text x="744" y="414">fields : vector&lt;Field&gt;</text>
  </g>
  <text x="744" y="442" font-size="13" fill="#80828c">агрегат: все поля — строки,</text>
  <text x="744" y="461" font-size="13" fill="#80828c">Field — пара key и value</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="744" y="500" width="100" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="794" y="519" text-anchor="middle" fill="#80828c">event.h</text>
  </g>

  <!-- разбор → событие -->
  <line x1="870" y1="262" x2="870" y2="314" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="880" y="293" font-size="12" fill="#80828c">заполняет *out</text>

  <!-- узел → событие -->
  <line x1="590" y1="445" x2="714" y2="445" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="688" y="437" font-size="12" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">event</text>

  <!-- ================= выданные тесты ================= -->
  <rect x="40" y="580" width="980" height="160" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="530" y="606" font-size="14" text-anchor="middle" fill="#80828c">выданные тесты</text>
  <g font-size="13" fill="#80828c" font-family="Consolas, Roboto Mono, monospace">
    <text x="64" y="636">list_tests.cpp</text>
    <text x="64" y="660">parse_tests.cpp</text>
    <text x="64" y="684">run_context.cmake</text>
    <text x="64" y="708">набор 1.1</text>
  </g>
  <g font-size="12" fill="#5c5e66">
    <text x="260" y="636">→ функции списка: пустой, один узел, тысяча, вытеснение; size сверяется с числом узлов</text>
    <text x="260" y="660">→ ParseEventLine и IsBlankOrComment; половина строк испорчена</text>
    <text x="260" y="684">→ запускает nano-edr целиком и сверяет строки [CTX]: два сценария, --window-size 1, --quiet</text>
    <text x="260" y="708">→ nano-edr --quiet на трёх сценариях: вывод детектов побайтово тот же, что на 1.1</text>
  </g>
</svg>
