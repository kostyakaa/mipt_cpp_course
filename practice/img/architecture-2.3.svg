<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 830" width="1080" height="830"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
    <marker id="pink" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1078" height="828" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ================= легенда ================= -->
  <g id="ownership" font-size="13">
    <text x="40" y="45" font-size="13" fill="#5c5e66"
          font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">файлы:</text>

    <rect x="100" y="28" width="104" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="152" y="45" text-anchor="middle" fill="#80828c">комплект</text>

    <rect x="216" y="28" width="132" height="24" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="282" y="45" text-anchor="middle" fill="#dbdfe6">меняете</text>

    <rect x="360" y="28" width="132" height="24" fill="#dbdfe6"/>
    <text x="426" y="45" text-anchor="middle" fill="#0b0b0d" font-weight="bold">пишете с нуля</text>
  </g>
  <text x="512" y="45" font-size="13" fill="#5c5e66">комплект менять нельзя; остальное — ваш src/</text>

  <text x="40" y="78" font-size="13" fill="#5c5e66">связи:</text>
  <line x1="100" y1="73" x2="150" y2="73" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="160" y="78" font-size="13" fill="#80828c">хранит в поле</text>
  <line x1="290" y1="73" x2="340" y2="73" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="350" y="78" font-size="13" fill="#80828c">вызывает</text>
  <rect x="448" y="64" width="34" height="18" fill="none" stroke="#80828c" stroke-width="1.2"/>
  <rect x="454" y="68" width="22" height="10" fill="none" stroke="#80828c" stroke-width="1.2"/>
  <text x="492" y="78" font-size="13" fill="#80828c">наследник, внутри — его база</text>

  <line x1="40" y1="96" x2="1040" y2="96" stroke="#26262b" stroke-width="1"/>

  <!-- ================= main ================= -->
  <rect x="40" y="112" width="230" height="150" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="155" y="142" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">main</text>
  <line x1="56" y1="156" x2="254" y2="156" stroke="#26262b" stroke-width="1"/>
  <text x="58" y="182" font-size="13" fill="#80828c">одна ветвь выбирает источник,</text>
  <text x="58" y="201" font-size="13" fill="#80828c">дальше только интерфейс</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="58" y="218" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="110" y="237" text-anchor="middle" fill="#dbdfe6">main.cpp</text>
  </g>

  <!-- main → источник -->
  <line x1="155" y1="262" x2="155" y2="324" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="166" y="298" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Run(&amp;agent)</text>

  <!-- ================= источники ================= -->
  <rect x="40" y="330" width="230" height="194" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="155" y="356" font-size="15" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">FileSource  OsSource</text>
  <rect x="56" y="368" width="198" height="46" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="155" y="387" font-size="13" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">IEventSource</text>
  <text x="155" y="405" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Run(handler)</text>
  <text x="155" y="434" font-size="12" text-anchor="middle" fill="#80828c">файл и граница os.h</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="56" y="446" width="124" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="118" y="465" text-anchor="middle" fill="#80828c">event_source.h</text>
    <rect x="56" y="482" width="88" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="100" y="501" text-anchor="middle" fill="#dbdfe6">sources.h</text>
    <rect x="152" y="482" width="102" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="203" y="501" text-anchor="middle" fill="#dbdfe6">sources.cpp</text>
  </g>

  <!-- источник → агент -->
  <polyline points="270,350 310,350 310,236 344,236" fill="none" stroke="#dbdfe6"
            stroke-width="2" marker-end="url(#flow)"/>
  <text x="318" y="306" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">HandleEvent</text>

  <!-- ================= Agent ================= -->
  <rect x="350" y="112" width="340" height="170" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="520" y="140" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Agent : IEventHandler</text>
  <rect x="368" y="152" width="304" height="52" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="520" y="173" font-size="13" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">IEventHandler</text>
  <text x="520" y="193" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">HandleEvent  OnSkipped  OnBroken  OnTick</text>
  <text x="520" y="226" font-size="12" text-anchor="middle" fill="#80828c">сработавшие правила — печать [DETECT]</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="368" y="240" width="84" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="410" y="259" text-anchor="middle" fill="#dbdfe6">agent.h</text>
    <rect x="462" y="240" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="514" y="259" text-anchor="middle" fill="#dbdfe6">agent.cpp</text>
  </g>

  <!-- агент → набор правил -->
  <line x1="690" y1="170" x2="774" y2="170" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="732" y="162" font-size="12" text-anchor="middle" fill="#80828c">заполняет</text>

  <!-- ================= набор правил ================= -->
  <rect x="780" y="112" width="260" height="150" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="910" y="140" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">набор правил</text>
  <text x="910" y="164" font-size="13" text-anchor="middle" fill="#80828c">пять MatchRule</text>
  <text x="910" y="183" font-size="13" text-anchor="middle" fill="#80828c">и одно SequenceRule</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="792" y="218" width="110" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="847" y="237" text-anchor="middle" fill="#dbdfe6">agent_rules.h</text>
    <rect x="910" y="218" width="118" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="969" y="237" text-anchor="middle" fill="#dbdfe6">agent_rules.cpp</text>
  </g>

  <!-- набор правил → движок -->
  <line x1="800" y1="262" x2="696" y2="370" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="752" y="294" font-size="12" text-anchor="end" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">AddRule</text>

  <!-- агент → движок -->
  <line x1="460" y1="282" x2="460" y2="324" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="450" y="308" font-size="12" text-anchor="end" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">engine_</text>
  <line x1="580" y1="282" x2="580" y2="324" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="590" y="308" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">ProcessEvent</text>

  <!-- ================= RuleEngine ================= -->
  <rect x="350" y="330" width="340" height="148" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="520" y="358" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">RuleEngine</text>
  <text x="520" y="383" font-size="13" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">rules_ : vector&lt;unique_ptr&lt;IRule&gt;&gt;</text>
  <text x="520" y="405" font-size="12" text-anchor="middle" fill="#80828c">Check каждого правила; сработавшие — в fired;</text>
  <text x="520" y="423" font-size="12" text-anchor="middle" fill="#80828c">печати нет</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="368" y="436" width="122" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="429" y="455" text-anchor="middle" fill="#80828c">rule_engine.h</text>
    <rect x="498" y="436" width="136" height="28" fill="#dbdfe6"/>
    <text x="566" y="455" text-anchor="middle" fill="#0b0b0d" font-weight="bold">rule_engine.cpp</text>
  </g>

  <!-- движок → правила -->
  <line x1="460" y1="478" x2="460" y2="534" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="450" y="512" font-size="12" text-anchor="end" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">rules_</text>
  <line x1="580" y1="478" x2="580" y2="534" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="590" y="512" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Check</text>

  <!-- ================= правила ================= -->
  <rect x="350" y="540" width="340" height="266" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="520" y="566" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">правила</text>

  <!-- MatchRule -->
  <rect x="362" y="578" width="316" height="84" fill="none" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="374" y="600" font-size="15" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">MatchRule</text>
  <text x="374" y="623" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">conditions_</text>
  <text x="374" y="643" font-size="12" fill="#80828c">все на одном событии</text>
  <rect x="530" y="588" width="138" height="64" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="599" y="606" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">RuleBase</text>
  <rect x="569" y="616" width="60" height="26" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="599" y="634" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">IRule</text>

  <!-- SequenceRule -->
  <rect x="362" y="670" width="316" height="84" fill="none" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="374" y="692" font-size="15" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">SequenceRule</text>
  <text x="374" y="715" font-size="12" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">first_ second_ pending_</text>
  <text x="374" y="735" font-size="12" fill="#80828c">два шага в окне</text>
  <rect x="530" y="680" width="138" height="64" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="599" y="698" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">RuleBase</text>
  <rect x="569" y="708" width="60" height="26" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="599" y="726" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">IRule</text>

  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="362" y="766" width="96" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="410" y="785" text-anchor="middle" fill="#80828c">rule.h</text>
    <rect x="466" y="766" width="104" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="518" y="785" text-anchor="middle" fill="#dbdfe6">rule.cpp</text>
  </g>

  <!-- правила → условия -->
  <line x1="690" y1="620" x2="774" y2="620" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="732" y="612" font-size="12" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">conditions_</text>
  <line x1="690" y1="666" x2="774" y2="666" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="732" y="658" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Matches</text>
  <line x1="690" y1="712" x2="774" y2="712" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#pink)"/>
  <text x="732" y="704" font-size="12" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">first_</text>
  <text x="732" y="730" font-size="12" text-anchor="middle" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">second_</text>

  <!-- ================= Event ================= -->
  <rect x="780" y="330" width="260" height="140" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="910" y="358" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">Event</text>
  <text x="910" y="382" font-size="13" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">event_type()</text>
  <text x="910" y="403" font-size="12" text-anchor="middle" fill="#80828c">тип строкой → EventType</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="792" y="428" width="84" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="834" y="447" text-anchor="middle" fill="#80828c">event.h</text>
    <rect x="884" y="428" width="100" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="934" y="447" text-anchor="middle" fill="#dbdfe6">event.cpp</text>
  </g>

  <!-- условия → Event -->
  <line x1="910" y1="540" x2="910" y2="476" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="922" y="512" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">event_type()</text>

  <!-- ================= условия ================= -->
  <rect x="780" y="540" width="260" height="266" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="910" y="566" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">условия</text>
  <text x="910" y="586" font-size="12" text-anchor="middle" fill="#80828c">семь наследников ICondition</text>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13" fill="#dbdfe6">
    <text x="796" y="614">FieldEquals</text>
    <text x="910" y="614">FieldContains</text>
    <text x="796" y="636">FieldEndsWith</text>
    <text x="910" y="636">FieldInList</text>
    <text x="796" y="658">EventTypeIs</text>
    <text x="796" y="692" fill="#ffffff">AllOf</text>
    <text x="852" y="692" fill="#ffffff">AnyOf</text>
  </g>
  <text x="912" y="692" font-size="12" fill="#ff8a8a"
        font-family="Consolas, Roboto Mono, monospace">parts_</text>
  <text x="796" y="714" font-size="12" fill="#80828c">условие из условий</text>
  <path d="M 966 688 C 1066 688, 1066 600, 1046 600" fill="none" stroke="#ff8a8a"
        stroke-width="2.5" marker-end="url(#pink)"/>
  <g font-family="Consolas, Roboto Mono, monospace" font-size="13">
    <rect x="792" y="766" width="108" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
    <text x="846" y="785" text-anchor="middle" fill="#80828c">conditions.h</text>
    <rect x="908" y="766" width="120" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
    <text x="968" y="785" text-anchor="middle" fill="#dbdfe6">conditions.cpp</text>
  </g>

  <!-- ================= тесты ================= -->
  <rect x="40" y="540" width="230" height="200" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="155" y="566" font-size="14" text-anchor="middle" fill="#80828c">выданные тесты</text>
  <text x="56" y="596" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">engine_tests.cpp</text>
  <text x="56" y="615" font-size="12" fill="#5c5e66">→ EventType, условия, правила,</text>
  <text x="56" y="633" font-size="12" fill="#5c5e66">движок, интерфейсы</text>
  <text x="56" y="664" font-size="13" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">набор 2.1</text>
  <text x="56" y="683" font-size="12" fill="#5c5e66">→ operator() условий;</text>
  <text x="56" y="701" font-size="12" fill="#5c5e66">два источника на одном</text>
  <text x="56" y="719" font-size="12" fill="#5c5e66">журнале — один вывод</text>

</svg>
