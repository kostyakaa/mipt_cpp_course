<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="1060" height="480"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="478" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- ================= легенда ================= -->
  <g id="ownership">
  <text x="40" y="45" font-size="13" fill="#5c5e66">файлы:</text>
  <rect x="100" y="28" width="104" height="24" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="152" y="45" font-size="13" text-anchor="middle" fill="#80828c">комплект</text>
  <rect x="216" y="28" width="100" height="24" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="266" y="45" font-size="13" text-anchor="middle" fill="#dbdfe6">меняете</text>
  </g>
  <text x="336" y="45" font-size="13" fill="#5c5e66">комплект менять нельзя; main.cpp — ваш src/</text>
  <text x="40" y="78" font-size="13" fill="#5c5e66">связи:</text>
  <line x1="100" y1="73" x2="150" y2="73" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="160" y="78" font-size="13" fill="#80828c">вызывает</text>
  <line x1="40" y1="96" x2="1020" y2="96" stroke="#26262b" stroke-width="1"/>

  <!-- ================= журнал ================= -->
  <rect x="40" y="120" width="260" height="150" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="170" y="146" font-size="16" text-anchor="middle" fill="#ffffff">журнал событий</text>
  <text x="170" y="170" font-size="12" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">ts=… type=… pid=… key=value</text>
  <text x="170" y="190" font-size="12" text-anchor="middle" fill="#80828c">и комментарии со словами,</text>
  <text x="170" y="208" font-size="12" text-anchor="middle" fill="#80828c">которые ищет агент</text>
  <rect x="100" y="228" width="140" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="170" y="247" font-size="13" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">scenarios/*.log</text>

  <!-- ================= main ================= -->
  <rect x="400" y="120" width="280" height="150" fill="rgba(255,255,255,0.04)" stroke="#3a3a40" stroke-width="1.5"/>
  <text x="540" y="148" font-size="20" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">main</text>
  <text x="540" y="172" font-size="12" text-anchor="middle" fill="#80828c">аргументы, цикл по строкам, фильтр,</text>
  <text x="540" y="190" font-size="12" text-anchor="middle" fill="#80828c">сводка по типам, поиск признаков —</text>
  <text x="540" y="208" font-size="12" text-anchor="middle" fill="#80828c">всё в одной функции</text>
  <rect x="484" y="228" width="112" height="28" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="540" y="247" font-size="13" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">main.cpp</text>

  <!-- main → журнал -->
  <line x1="400" y1="180" x2="306" y2="180" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="353" y="172" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">getline</text>

  <!-- ================= stdout ================= -->
  <rect x="760" y="120" width="260" height="110" fill="none" stroke="#26262b" stroke-width="1.5"/>
  <text x="890" y="146" font-size="16" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">stdout</text>
  <text x="776" y="174" font-size="13" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">[DETECT] строка …</text>
  <text x="776" y="192" font-size="12" fill="#80828c">всегда, формат задан точно</text>
  <text x="776" y="214" font-size="12" fill="#80828c">сводка — только без --quiet</text>

  <!-- main → stdout -->
  <line x1="680" y1="160" x2="754" y2="160" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="717" y="152" font-size="12" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">print</text>

  <!-- ================= stderr ================= -->
  <rect x="760" y="330" width="260" height="90" fill="none" stroke="#26262b" stroke-width="1.5"/>
  <text x="890" y="356" font-size="16" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">stderr</text>
  <text x="776" y="382" font-size="12" fill="#80828c">ошибки аргументов и файла,</text>
  <text x="776" y="400" font-size="12" fill="#80828c">тогда код завершения 2</text>

  <!-- main → stderr -->
  <polyline points="680,250 720,250 720,375 754,375" fill="none" stroke="#dbdfe6"
            stroke-width="2" marker-end="url(#flow)"/>
  <text x="730" y="318" font-size="12" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">print</text>

  <!-- ================= тесты ================= -->
  <rect x="40" y="330" width="640" height="120" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="56" y="356" font-size="14" fill="#80828c">выданные тесты: phishing_macro, ransomware, clean_office</text>
  <text x="56" y="380" font-size="12" fill="#5c5e66">ждут код завершения 0 и stdout, совпадающий с эталоном побайтово</text>
  <rect x="56" y="398" width="140" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="126" y="417" font-size="13" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">run_case.cmake</text>
  <rect x="204" y="398" width="140" height="28" fill="none" stroke="#80828c" stroke-width="1.5"/>
  <text x="274" y="417" font-size="13" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">expected/*.out</text>

  <!-- тесты → main -->
  <line x1="540" y1="330" x2="540" y2="276" stroke="#dbdfe6" stroke-width="2" marker-end="url(#flow)"/>
  <text x="528" y="308" font-size="12" text-anchor="end" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">nano-edr журнал --quiet</text>
</svg>
