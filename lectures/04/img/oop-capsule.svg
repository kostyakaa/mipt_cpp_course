<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="1060" height="320"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="light" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="318" rx="16" fill="#0b0b0d" stroke="#26262b"/>

  <!-- подписи колонок -->
  <text x="40" y="48" font-size="16" fill="#80828c">код пользователя</text>
  <text x="480" y="48" font-size="16" text-anchor="middle" fill="#80828c">интерфейс: что делает</text>
  <text x="800" y="48" font-size="16" text-anchor="middle" fill="#80828c">внутри: как сделано</text>

  <!-- объект-капсула -->
  <rect x="480" y="70" width="540" height="220" rx="28" fill="rgba(255,255,255,0.02)"
        stroke="#dbdfe6" stroke-width="2"/>
  <text x="1000" y="100" font-size="16" text-anchor="end" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">Circle c</text>

  <!-- кнопки интерфейса на границе -->
  <rect x="410" y="96" width="140" height="44" rx="6" fill="#0b0b0d" stroke="#dbdfe6" stroke-width="2"/>
  <text x="480" y="124" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">area()</text>
  <rect x="410" y="156" width="140" height="44" rx="6" fill="#0b0b0d" stroke="#dbdfe6" stroke-width="2"/>
  <text x="480" y="184" font-size="18" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">scale(k)</text>

  <!-- вызовы через интерфейс проходят -->
  <text x="40" y="125" font-size="20" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">c.area();</text>
  <line x1="190" y1="118" x2="402" y2="118" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>
  <text x="40" y="185" font-size="20" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">c.scale(2);</text>
  <line x1="190" y1="178" x2="402" y2="178" stroke="#dbdfe6" stroke-width="2" marker-end="url(#light)"/>

  <!-- прямой доступ к полю упирается в стенку -->
  <text x="40" y="255" font-size="20" fill="#ff2020"
        font-family="Consolas, Roboto Mono, monospace">c.r_ = -5;</text>
  <line x1="190" y1="248" x2="466" y2="248" stroke="#ff2020" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="468" y1="236" x2="492" y2="260" stroke="#ff2020" stroke-width="2.5"/>
  <line x1="468" y1="260" x2="492" y2="236" stroke="#ff2020" stroke-width="2.5"/>
  <text x="330" y="278" font-size="15" text-anchor="middle" fill="#ff2020">CE: поле спрятано</text>

  <!-- устройство: сама фигура -->
  <circle cx="680" cy="185" r="65" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <circle cx="680" cy="185" r="3.5" fill="#dbdfe6"/>
  <line x1="680" y1="185" x2="745" y2="185" stroke="#dbdfe6" stroke-width="2"/>
  <text x="712" y="176" font-size="17" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">r_</text>

  <!-- устройство: поле и правило -->
  <rect x="800" y="118" width="170" height="56" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="885" y="155" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Consolas, Roboto Mono, monospace">5.0</text>
  <text x="885" y="196" font-size="16" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">double r_</text>
  <text x="885" y="246" font-size="16" text-anchor="middle" fill="#80828c">правило объекта:</text>
  <text x="885" y="272" font-size="18" text-anchor="middle" fill="#dbdfe6">всегда r_ ≥ 0</text>
</svg>
