<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 372" width="1060" height="372"
     font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="light" markerWidth="11" markerHeight="11" refX="10" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dbdfe6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1058" height="370" rx="16" fill="#0b0b0d" stroke="#26262b"/>
  <line x1="530" y1="40" x2="530" y2="342" stroke="#26262b" stroke-width="1.5"/>

  <!-- без virtual -->
  <text x="280" y="58" font-size="19" text-anchor="middle" fill="#ff2020">получилось: без <tspan font-family="Consolas, Roboto Mono, monospace">virtual</tspan></text>
  <text x="150" y="92" font-size="14" text-anchor="middle" fill="#80828c">объект за <tspan font-family="Consolas, Roboto Mono, monospace">Rule*</tspan></text>
  <text x="405" y="92" font-size="14" text-anchor="middle" fill="#80828c">что вызвано</text>

  <g fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2">
    <rect x="60" y="104" width="180" height="44"/>
    <rect x="60" y="164" width="180" height="44"/>
    <rect x="60" y="224" width="180" height="44"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">
    <text x="150" y="131">ByNameRule</text>
    <text x="150" y="191">ByParentRule</text>
    <text x="150" y="251">ByRateRule</text>
  </g>

  <g stroke="#dbdfe6" stroke-width="2.5" fill="none">
    <path d="M 240 126 C 272 126, 272 172, 302 172" marker-end="url(#light)"/>
    <line x1="240" y1="186" x2="302" y2="186" marker-end="url(#light)"/>
    <path d="M 240 246 C 272 246, 272 200, 302 200" marker-end="url(#light)"/>
  </g>

  <rect x="308" y="146" width="196" height="80" fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2"/>
  <text x="406" y="181" font-size="16" text-anchor="middle" fill="#dbdfe6"
        font-family="Consolas, Roboto Mono, monospace">Rule::Matches</text>
  <text x="406" y="206" font-size="14" text-anchor="middle" fill="#80828c"
        font-family="Consolas, Roboto Mono, monospace">return false</text>

  <text x="280" y="306" font-size="16" text-anchor="middle" fill="#dbdfe6">выбор по типу указателя — при компиляции</text>
  <text x="280" y="332" font-size="16" text-anchor="middle" fill="#ff2020">одна функция на всех, детектов нет</text>

  <!-- с virtual -->
  <text x="780" y="58" font-size="19" text-anchor="middle" fill="#dbdfe6">нужно: с <tspan font-family="Consolas, Roboto Mono, monospace">virtual</tspan></text>
  <text x="650" y="92" font-size="14" text-anchor="middle" fill="#80828c">объект за <tspan font-family="Consolas, Roboto Mono, monospace">Rule*</tspan></text>
  <text x="900" y="92" font-size="14" text-anchor="middle" fill="#80828c">что вызвано</text>

  <g fill="rgba(255,255,255,0.05)" stroke="#dbdfe6" stroke-width="2">
    <rect x="570" y="104" width="160" height="44"/>
    <rect x="570" y="164" width="160" height="44"/>
    <rect x="570" y="224" width="160" height="44"/>
    <rect x="786" y="104" width="228" height="44"/>
    <rect x="786" y="164" width="228" height="44"/>
    <rect x="786" y="224" width="228" height="44"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#dbdfe6" font-family="Consolas, Roboto Mono, monospace">
    <text x="650" y="131">ByNameRule</text>
    <text x="650" y="191">ByParentRule</text>
    <text x="650" y="251">ByRateRule</text>
    <text x="900" y="131">ByNameRule::Matches</text>
    <text x="900" y="191">ByParentRule::Matches</text>
    <text x="900" y="251">ByRateRule::Matches</text>
  </g>

  <g stroke="#dbdfe6" stroke-width="2.5">
    <line x1="730" y1="126" x2="780" y2="126" marker-end="url(#light)"/>
    <line x1="730" y1="186" x2="780" y2="186" marker-end="url(#light)"/>
    <line x1="730" y1="246" x2="780" y2="246" marker-end="url(#light)"/>
  </g>

  <text x="780" y="306" font-size="16" text-anchor="middle" fill="#dbdfe6">выбор по самому объекту — во время выполнения</text>
  <text x="780" y="332" font-size="16" text-anchor="middle" fill="#dbdfe6">у каждого правила свой <tspan font-family="Consolas, Roboto Mono, monospace">Matches</tspan></text>
</svg>
